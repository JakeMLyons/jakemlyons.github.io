<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Lyons</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #1a1a1a;
      --text:   #e8e8e8;
      --muted:  #999999;
      --accent: #7a9fbf;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 32rem;
      text-align: center;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.01em;
    }

    p {
      margin-top: 0.75rem;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    a:hover, a:focus-visible { border-bottom-color: currentColor; }
  </style>
</head>
<body>

  <main>
    <h1>Jake Lyons</h1>
    <p>Side projects &amp; experiments. Most of it lives on <a href="https://github.com/JakeMLyons">GitHub</a>.</p>
  </main>

</body>
</html>
